name: Refresh risk data

# Rebuilds the static datasets from the World Bank and GDELT APIs, commits any
# change and redeploys the site. A push made with GITHUB_TOKEN does not trigger
# other workflows, so the deploy is called explicitly.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      newsLimit:
        description: 'How many of the riskiest countries to fetch news for'
        required: false
        default: '40'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Rebuild datasets
        run: node scripts/etl/build.mjs --news-limit=${{ github.event.inputs.newsLimit || '40' }}

      - name: Sanity check the output
        run: node scripts/etl/verify.mjs

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data change."
          else
            git commit -m "chore(data): refresh risk datasets"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
